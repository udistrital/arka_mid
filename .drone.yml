kind: pipeline
name: oas_api_ci

trigger:
  event:
    exclude:
      - tag

steps:
- name: check_readme
  image: jjvargass/qa_develoment:latest
  commands:
  - python /app/check_readme.py
  when:
    branch:
    - develop
    - feature/*
    - release/*
    event:
    - push

- name: check_branch
  image: jjvargass/qa_develoment:latest
  commands:
  - python /app/check_branch.py -H ${DRONE_GIT_HTTP_URL}
  when:
    branch:
    - develop
    - feature/*
    - release/*
    event:
    - push

- name: check_commits
  image: jjvargass/qa_develoment:latest
  failure: ignore
  commands:
  - python /app/check_commits.py
  when:
    branch:
    - develop
    - feature/*
    - release/*
    event:
    - push

- name: go_run_test
  image: golang:1.25
  commands:
    - go vet ./...
    - go fmt ./... && git diff --exit-code || (echo "Go fmt detected formatting issues! Please run 'go fmt' to format your code." && exit 1)
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run --out-format checkstyle --timeout=5m > lint_report.xml || true
    - cat lint_report.xml
    # - go install github.com/axw/gocov/...@latest
    # - go install github.com/AlekSi/gocov-xml@latest
    # - gocov test ./... | gocov-xml > coverage.xml
    # - cat coverage.xml
    # - go install github.com/jstemmer/go-junit-report@latest
    # - go test -v ./... | go-junit-report > test_report.xml
    # - cat test_report.xml
  when:
    branch:
      - feature/*
      - develop
      - release/*
      - hotfix/*
    event:
      - push

- name: run_sonar_scanner
  image: sonarsource/sonar-scanner-cli:latest
  environment:
    SONAR_HOST_URL:
      from_secret: SONAR_HOST
    SONAR_TOKEN:
      from_secret: SONAR_TOKEN
    SONAR_SCANNER_OPTS: "-Dsonar.working.directory=/tmp/.scannerwork"
  commands:
    - sonar-scanner
  when:
    branch:
      - feature/*
      - develop
      - release/*
      - hotfix/*
      - master
    event:
    - push

- name: go_build
  image: golang:1.25
  commands:
  - GOOS=linux GOARCH=amd64 go build -o main
  when:
    branch:
    - dependabot/**
    - develop
    - hotfix/*
    - feature/*
    - master
    - release/*
    event:
    - push

- name: publish_to_ecr_release
  image: plugins/ecr
  settings:
    access_key:
      from_secret: AWS_ACCESS_KEY_ID
    secret_key:
      from_secret: AWS_SECRET_ACCESS_KEY
    region:
      from_secret: AWS_REGION
    repo: ${DRONE_REPO##udistrital/}
    tags:
      - ${DRONE_COMMIT:0:7}
      - release
  when:
    branch:
    - release/*
    event:
    - push

- name: publish_to_ecr_master
  image: plugins/ecr
  settings:
    access_key:
      from_secret: AWS_ACCESS_KEY_ID
    secret_key:
      from_secret: AWS_SECRET_ACCESS_KEY
    region:
      from_secret: AWS_REGION
    repo: ${DRONE_REPO##udistrital/}
    tags:
      - ${DRONE_COMMIT:0:7}
      - latest
  when:
    branch:
    - master
    event:
    - push

- name: update_ecs_service
  image: amazon/aws-cli:latest
  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION:
      from_secret: AWS_REGION
  commands:
  - case ${DRONE_BRANCH} in
    master)
    SUFFIX=prod
    CLUSTER=oas
      ;;
    *)
    SUFFIX=test
    CLUSTER=test
      ;;
    esac
  - aws ecs update-service
    --cluster $${CLUSTER}
    --service $${DRONE_REPO_NAME}_$${SUFFIX}
    --force-new-deployment
    --query "service.deployments[0].id"
  when:
    branch:
      - release/*
      - master
    event:
      - push
